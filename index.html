<section class="toolbar">

  <input
    id="search"
    type="search"
    placeholder="Search country or ISO code"
  >

  <button
    id="clearSearch"
    type="button"
  >
    Clear
  </button>

  <select id="presence">
    <option value="">All Christian-presence evidence</option>
    <option value="documented">Documented presence</option>
    <option value="limited">Small / limited presence</option>
    <option value="unknown">Evidence not established</option>
  </select>

  <select id="sort">
    <option value="need">People in need ↓</option>
    <option value="name">Country A–Z</option>
    <option value="start">Crisis start</option>
  </select>

</section>
